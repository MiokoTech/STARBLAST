# ===================================================================
# STARBLAST Default Options Configuration
# This file defines the default game options on initialization.
# ===================================================================

[settings]
# Display & Graphics
screen_mode = 1                # 0 = Fill, 1 = Center
sprite_style = 0               # 0 = Localcoord, 1 = Original
shadow_enabled = true          # Character shadow toggle
framerate = 60                 # Target frame rate (30 or 60 FPS)
quality = medium               # low, medium, high, higher, best
shine_effect = medium          # low, medium, high
bg_blur = true                 # Background blur effect toggle

# Audio
sound_volume = 0.7             # Sound effects volume (0.0 - 1.0)
bgm_volume = 0.7               # Background music volume (0.0 - 1.0)

# Touch Screen / Mobile Screenpad
screenpad_layout = default     # Screenpad button layout preset
screenpad_opacity = 0.7        # Button opacity level (0.0 - 1.0)
screenpad_mode = 1             # 1 = Standard joystick mode
wankai_auto_hide = true        # Auto-hide transform button when Qi is insufficient
special_auto_hide = true       # Auto-hide special button when Qi is insufficient
super_skill_auto_hide = true   # Auto-hide super/bisha button when Qi is insufficient

[config]
difficulty = 4                 # Game AI difficulty: 1 = Easy, 2 = Normal, 3 = Hard, 4 = Very Hard
life_point = 1.0               # Fighter HP multiplier: 1.0 = 100% (0.5, 1.0, 2.0, 3.0, 5.0)
rounds = 2                     # Rounds required to win per match (1, 2, 3)
fight_time = 60                # Round time limit in seconds (30, 60, 90, 120, 150, 180, -1 = Infinite)
show_hp = false                # Display numerical HP overlay on battle HUD
camera_zoom_speed = 0.7        # Camera zoom speed multiplier (0.5 - 1.0)
camera_distance = 2.5          # Camera distance preset: 2.5 = Near, 2.0 = Normal, 1.5 = Far
camera_style = 0               # Camera tracking style: 0 = BVN Original, 1 = STARBLAST Smooth

[rules]
assister_partner = true        # Enable assister partner call in battle
bisha_energy_max = 3           # Maximum bisha / super energy bars (1 - 5)
qi_gain_rate = 1.0             # Qi energy gain rate multiplier (1.0x - 5.0x)
gameplay_style = 0             # 0 = BVN Classic, 1 = STARBLAST Custom

[controls]
# Default keyboard keycodes: Up, Down, Left, Right, Attack, Jump, Dash, Skill, Special, Super
# P1: W, S, A, D, J, K, L, U, I, O
key_p1 = 87, 83, 65, 68, 74, 75, 76, 85, 73, 79
# P2: Up, Down, Left, Right, Numpad 1..6
key_p2 = 38, 40, 37, 39, 97, 98, 99, 100, 101, 102
